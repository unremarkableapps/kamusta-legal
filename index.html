<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamusta — legal</title>
<style>
  :root{
    --terra:#AF583C; --deep:#94472F; --ink:#402B26; --cream:#F9F6ED;
    --card:#FFFEF9; --gray:#8E8B85; --line:#E8E1D3;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.6; padding:24px;
  }
  .wrap{max-width:640px; margin:0 auto}
  h1{color:var(--deep); font-size:26px; margin:24px 0 8px}
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:20px; margin-top:16px;
  }
  a{color:var(--terra); font-weight:600; text-decoration:none}
  a:hover{text-decoration:underline}
  .muted{color:var(--gray); font-size:14px}
  ul{padding-left:20px; margin:0} li{margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kamusta — legal</h1>
  <p><strong>Kamusta</strong>, published by <strong>Rica R. Redonia</strong>,
  is a family check-in app.</p>

  <div class="card">
    <ul>
      <li><a href="delete-my-data.html">Delete your account &amp; data</a></li>
      <li><a href="privacy-policy.html">Privacy policy</a></li>
      <li><a href="terms-of-service.html">Terms of service</a></li>
    </ul>
  </div>

  <p class="muted" style="margin-top:24px">App: Kamusta ·
  Developer: Rica R. Redonia ·
  Contact: <a href="mailto:unremarkableapps@gmail.com">unremarkableapps@gmail.com</a></p>
</div>
</body>
</html>
